[project]
name = "labflow-planner"
version = "1.0.0"
description = "FastAPI service for laboratory planning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.124.2",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy==2.0.48",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "pylint==4.0.5",
]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pylint.main]
py-version = "3.14"
load-plugins = []

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100
